version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: legal_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legaldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legaldb"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: legal_neo4j
    environment:
      NEO4J_AUTH: "neo4j/neo4jpass"
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREE: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpass \"RETURN 1\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
